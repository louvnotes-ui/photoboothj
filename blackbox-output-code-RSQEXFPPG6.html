<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
        video, canvas { border: 1px solid #ccc; margin: 10px; }
        button { margin: 5px; padding: 10px; }
        #filters { margin: 20px; }
        #strip { display: none; }
    </style>
</head>
<body>
    <h1>Photobooth</h1>
    <video id="video" width="640" height="480" autoplay></video>
    <canvas id="canvas" width="640" height="480"></canvas>
    <br>
    <button id="start">Start Camera</button>
    <button id="capture">Capture Photo</button>
    <button id="loadDesign">Upload Strip Design</button>
    <input type="file" id="designInput" accept="image/*" style="display: none;">
    <div id="filters">
        <button id="grayscale">Grayscale</button>
        <button id="sepia">Sepia</button>
        <button id="blur">Blur</button>
        <button id="invert">Invert</button>
        <button id="reset">Reset Filter</button>
    </div>
    <button id="generateStrip">Generate Strip (4 Photos)</button>
    <canvas id="strip" width="640" height="480"></canvas>
    <br>
    <a id="downloadLink" download="photostrip.png" style="display: none;">Download Strip</a>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const stripCanvas = document.getElementById('strip');
        const stripCtx = stripCanvas.getContext('2d');
        let stream;
        let photos = [];
        let designImage = null;
        let currentFilter = null;

        // Start camera
        document.getElementById('start').addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                alert('Camera access denied or unavailable.');
            }
        });

        // Capture photo
        document.getElementById('capture').addEventListener('click', () => {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            if (currentFilter) applyFilterToCanvas(currentFilter);
            const imgData = canvas.toDataURL();
            photos.push(imgData);
            if (photos.length >= 4) {
                document.getElementById('generateStrip').disabled = false;
            }
        });

        // Load design
        document.getElementById('loadDesign').addEventListener('click', () => {
            document.getElementById('designInput').click();
        });
        document.getElementById('designInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = () => {
                    designImage = new Image();
                    designImage.src = reader.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Filters
        document.getElementById('grayscale').addEventListener('click', () => applyFilter('grayscale'));
        document.getElementById('sepia').addEventListener('click', () => applyFilter('sepia'));
        document.getElementById('blur').addEventListener('click', () => applyFilter('blur'));
        document.getElementById('invert').addEventListener('click', () => applyFilter('invert'));
        document.getElementById('reset').addEventListener('click', () => { currentFilter = null; ctx.drawImage(video, 0, 0); });

        function applyFilter(filter) {
            currentFilter = filter;
            ctx.drawImage(video, 0, 0);
            applyFilterToCanvas(filter);
        }

        function applyFilterToCanvas(filter) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                if (filter === 'grayscale') {
                    const gray = 0.3 * r + 0.59 * g + 0.11 * b;
                    data[i] = data[i+1] = data[i+2] = gray;
                } else if (filter === 'sepia') {
                    data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
                    data[i+1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
                    data[i+2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
                } else if (filter === 'blur') {
                    // Simple blur (for better, use a library)
                    data[i] = (data[i] + data[i+4] + data[i+canvas.width*4]) / 3;
                    data[i+1] = (data[i+1] + data[i+5] + data[i+1+canvas.width*4]) / 3;
                    data[i+2] = (data[i+2] + data[i+6] + data[i+2+canvas.width*4]) / 3;
                } else if (filter === 'invert') {
                    data[i] = 255 - r;
                    data[i+1] = 255 - g;
                    data[i+2] = 255 - b;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // Generate strip
        document.getElementById('generateStrip').addEventListener('click', () => {
            if (!designImage || photos.length < 4) return;
            stripCtx.drawImage(designImage, 0, 0, stripCanvas.width, stripCanvas.height);
            // Example positions for 4 photos (customize for your design)
            const positions = [
                { x: 50, y: 50, w: 200, h: 150 },
                { x: 260, y: 50, w: 200, h: 150 },
                { x: 50, y: 210, w: 200, h: 150 },
                { x: 260, y: 210, w: 200, h: 150 }
            ];
            photos.forEach((photo, i) => {
                const img = new Image();
                img.src = photo;
                img.onload = () => {
                    stripCtx.drawImage(img, positions[i].x, positions[i].y, positions[i].w, positions[i].h);
                    if (i === 3) { // After last photo
                        document.getElementById('strip').style.display = 'block';
                        document.getElementById('downloadLink').href = stripCanvas.toDataURL();
                        document.getElementById('downloadLink').style.display = 'inline';
                    }
                };
            });
            photos = []; // Reset
        });
    </script>
</body>
</html>
